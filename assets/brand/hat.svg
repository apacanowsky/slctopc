<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Brim -->
  <ellipse cx="200" cy="210" rx="185" ry="42" fill="#c9a876"/>
  <ellipse cx="200" cy="205" rx="185" ry="42" fill="#d4b688"/>
  <ellipse cx="200" cy="205" rx="185" ry="42" fill="none" stroke="#b89665" stroke-width="2"/>

  <!-- Crown -->
  <path d="M110 205 C108 130 140 62 200 60 C260 62 292 130 290 205 Z" fill="#d9bb8e"/>
  <path d="M110 205 C108 130 140 62 200 60 C260 62 292 130 290 205 Z" fill="none" stroke="#b89665" stroke-width="2"/>

  <!-- Crown top dent shading -->
  <path d="M200 60 C230 62 254 92 262 130 C240 118 220 112 200 112 C180 112 160 118 138 130 C146 92 170 62 200 60 Z" fill="#c9a876" opacity="0.55"/>

  <!-- Rope band around crown base -->
  <g stroke="#5b4a2f" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M112 196 Q 200 222 288 196"/>
  </g>
  <g stroke="#7a6440" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="1 15">
    <path d="M112 196 Q 200 222 288 196"/>
  </g>
  <!-- rope twist highlight -->
  <g stroke="#94805a" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M114 193 Q 200 218 286 193"/>
  </g>

  <!-- Wordmark badge on crown -->
  <g transform="translate(200,148)" text-anchor="middle">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" letter-spacing="1" fill="#20242a">SLC</text>
    <text x="0" y="24" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" letter-spacing="1" fill="#20242a">to PC</text>
  </g>
</svg>
